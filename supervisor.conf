; ── Socket.io real-time push server (Feature 3) ──────────────────────────────
[program:mpwa-socket]
command=node /var/www/html/whatsapp/server.js
directory=/var/www/html/whatsapp
user=www-data
autostart=true
autorestart=true
startsecs=3
startretries=5
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/var/www/html/whatsapp/storage/logs/socket.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

; ── Laravel queue workers (4 processes) ──────────────────────────────────────
[program:mpwa-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/html/whatsapp/artisan queue:work database --queue=broadcasts,default --tries=5 --timeout=300 --sleep=1 --max-jobs=500
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/www/html/whatsapp/storage/logs/worker.log
stopwaitsecs=600

[group:mpwa]
programs=mpwa-socket,mpwa-worker

; ─── To activate all at once: ────────────────────────────────────────────────
; sudo cp /var/www/html/whatsapp/supervisor.conf /etc/supervisor/conf.d/mpwa.conf
; sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start mpwa:*
;
; ─── To switch to Redis queue (faster, for 100k+ blasts): ────────────────────
; 1. Install Redis:  sudo apt install redis-server php-redis
; 2. In .env set:   QUEUE_CONNECTION=redis
; 3. Update command above: replace "database" with "redis"
; 4. sudo supervisorctl restart mpwa-worker:*
;
; ─── Schedule:run cron (add via: crontab -e) ─────────────────────────────────
; * * * * * php /var/www/html/whatsapp/artisan schedule:run >> /dev/null 2>&1
